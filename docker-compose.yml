services:
  db:
    image: ankane/pgvector
    container_name: facial_db
    environment:
      POSTGRES_DB: facial_recognition
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/init_database.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: facial_api
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8001:8000"
    depends_on:
      - db

volumes:
  db_data:

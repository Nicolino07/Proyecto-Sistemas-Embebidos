services:
  db:
    image: ankane/pgvector
    container_name: facial_db
    environment:
      POSTGRES_DB: facial_recognition
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/init_database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
